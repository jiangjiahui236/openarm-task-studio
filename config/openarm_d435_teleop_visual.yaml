robot:
  base_frame: world
tracking:
  min_visibility: 0.55
  min_command_confidence: 0.45
  depth_window_px: 3
  enable_depth_filters: true
  depth_temporal_alpha: 0.95
  depth_temporal_delta: 30
  min_arm_segment_m: 0.035
  reference_min_arm_segment_m: 0.12
  max_arm_segment_m: 0.65
  segment_ratio_min: 0.15
  segment_ratio_max: 1.65
  max_point_speed_m_s: 20.0
  point_jump_allowance_m: 0.08
  position_smoothing_alpha: 0.95
  depth_dropout_hold_s: 0.15
mapping:
  orientation_mode: fixed
  camera_to_robot_delta:
    x: -camera_z
    y: camera_x
    z: -camera_y
  position_scale:
  - 0.45
  - 0.55
  - 0.3
  max_delta_m:
  - 0.14
  - 0.1
  - 0.18
filter:
  min_cutoff: 1.2
  beta: 0.08
  d_cutoff: 1.0
  orientation_window: 5
control:
  command_mode: joint_pose
  command_rate_hz: 30.0
  trajectory_time_s: 0.05
  velocity_feedforward_gain: 1.5
  ik_timeout_s: 0.25
  avoid_collisions: true
  prefer_configured_ik_seed: true
teaching_protection:
  max_single_packet_jump_rad: 0.3
  jump_confirmation_tolerance_rad: 0.55
  max_joint_speed_rad_s:
